name: build-slabpin

on:
  workflow_dispatch:

jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -static -o slabpin_probe slabpin_probe.c
          ls -la slabpin_probe
      - uses: actions/upload-artifact@v4
        with:
          name: slabpin
          path: slabpin_probe
name: build-place

on:
  workflow_dispatch:

jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -static -o payload_build payload_build.c
          aarch64-linux-gnu-gcc -O2 -static -o place_test place_test.c
          ls -la payload_build place_test
          sha256sum payload_build place_test
      - uses: actions/upload-artifact@v4
        with:
          name: place
          path: |
            payload_build
            place_test
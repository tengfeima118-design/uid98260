name: build-lifostat

on:
  workflow_dispatch:

jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -static -o lifo_stat lifo_stat.c
          ls -la lifo_stat
      - uses: actions/upload-artifact@v4
        with:
          name: lifostat
          path: lifo_stat
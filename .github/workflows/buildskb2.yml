name: build-skb2

on:
  workflow_dispatch:

jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -static -o skb_probe2 skb_probe2.c
          sha256sum skb_probe2 | tee shaskb2.txt
      - uses: actions/upload-artifact@v4
        with:
          name: skb2
          path: |
            skb_probe2
            shaskb2.txt
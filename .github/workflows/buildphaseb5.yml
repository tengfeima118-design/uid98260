name: build-phaseb5

on:
  workflow_dispatch:

jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -static -o phase_b5 phase_b5.c
          ls -la phase_b5
          sha256sum phase_b5
      - uses: actions/upload-artifact@v4
        with:
          name: phaseb5
          path: phase_b5
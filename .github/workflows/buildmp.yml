name: build-mp

on:
  workflow_dispatch:

jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -static -o mute_probe mute_probe.c
          sha256sum mute_probe | tee shamp.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mp
          path: |
            mute_probe
            shamp.txt
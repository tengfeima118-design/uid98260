name: build-lifo

on:
  workflow_dispatch:

jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -static -o lifo_probe lifo_probe.c
          sha256sum lifo_probe | tee shalifo.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lifo
          path: |
            lifo_probe
            shalifo.txt
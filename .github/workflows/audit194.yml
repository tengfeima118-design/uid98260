name: audit194

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup deps
        run: python3 -m pip install --quiet pyelftools capstone vmlinux-to-elf

      - name: Assemble kernel from parts
        run: |
          cat kb/p00 kb/p01 kb/p02 > kernel.bin
          ls -la kernel.bin
          WANT=$(cat kb/sha.txt)
          GOT=$(sha256sum kernel.bin | cut -d' ' -f1)
          echo "want=$WANT"
          echo "got =$GOT"
          if [ "$WANT" = "$GOT" ]; then echo "SHA OK"; else echo "SHA MISMATCH"; exit 1; fi

      - name: Convert to ELF
        run: |
          vmlinux-to-elf kernel.bin vmlinux.elf 2>&1 | tail -20 || true
          ls -la vmlinux.elf 2>/dev/null || echo NOELF

      - name: Audit three targets
        run: |
          if [ -f vmlinux.elf ]; then
            python3 audit_194.py vmlinux.elf 2>&1 | head -500
          else
            echo "=== ELF 转换失败，走 raw kallsyms 自解析 ==="
            python3 raw_kallsyms.py 2>&1 | head -60
          fi
name: audit194

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup deps
        run: python3 -m pip install --quiet pyelftools capstone vmlinux-to-elf

      - name: Fetch kernel from Honor OTA
        run: |
          python3 fetch_and_audit.py 2>&1 | tail -60
          ls -la kernel.bin 2>/dev/null || true

      - name: Convert to ELF
        run: |
          ls -la kernel.bin || exit 1
          vmlinux-to-elf kernel.bin vmlinux.elf 2>&1 | tail -15 || true
          ls -la vmlinux.elf 2>/dev/null || echo NOELF

      - name: Audit
        run: |
          if [ -f vmlinux.elf ]; then
            python3 audit_194.py vmlinux.elf 2>&1 | head -400
          else
            python3 raw_scan.py 2>&1 | head -50
          fi
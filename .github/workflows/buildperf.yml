name: build-perf

on:
  workflow_dispatch:

jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -static -o perf_leak perf_leak.c
          sha256sum perf_leak | tee shaperf.txt
      - uses: actions/upload-artifact@v4
        with:
          name: perf
          path: |
            perf_leak
            shaperf.txt